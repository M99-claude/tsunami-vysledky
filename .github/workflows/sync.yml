name: Aktualizacia vysledkov

on:
  schedule:
    # Casy su v UTC (Slovensko = UTC+2 v lete, UTC+1 v zime).
    # So-Ne: kazdych 20 minut medzi 7:00 a 22:59 UTC (v lete 9:00-00:40, v zime 8:00-23:40)
    #        - mladez hra cez vikend aj dopoludnia
    - cron: "*/20 7-22 * * 6,0"
    # Pia: kazdych 20 minut medzi 12:00 a 22:59 UTC
    - cron: "*/20 12-22 * * 5"
    # Po-St: raz za hodinu vecer (zapasy cez tyzden)
    - cron: "5 16-22 * * 1-4"
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisat zmeny do adminu (inak len nahlad)"
        type: boolean
        default: false

concurrency:
  group: sync-vysledky
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synchronizacia so szfb.sk
        env:
          EOS_EMAIL: ${{ secrets.EOS_EMAIL }}
          EOS_PASSWORD: ${{ secrets.EOS_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python3 sync_vysledky.py --apply
          else
            python3 sync_vysledky.py
          fi
