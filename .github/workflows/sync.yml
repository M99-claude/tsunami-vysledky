name: Aktualizacia vysledkov

on:
  # Behy spusta externe cron-job.org cez GitHub API (workflow_dispatch s apply=true).
  # Vlastny casovac GitHubu (schedule) sa nepouziva - naplanovane behy casto vynechaval.
  workflow_dispatch:
    inputs:
      apply:
        description: "Zapisat zmeny do adminu (inak len nahlad)"
        type: boolean
        default: false

concurrency:
  group: sync-vysledky
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synchronizacia so szfb.sk
        env:
          EOS_EMAIL: ${{ secrets.EOS_EMAIL }}
          EOS_PASSWORD: ${{ secrets.EOS_PASSWORD }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python3 sync_vysledky.py --apply
          else
            python3 sync_vysledky.py
          fi
